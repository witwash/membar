name: starter_recipes
description: The bundled starter cocktail and coffee recipes, and the loader that reads them.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ^3.47.5

dependencies:
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  json_annotation: ^4.12.0
  recipes_api:
    path: ../recipes_api

dev_dependencies:
  build_runner: ^2.16.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.1
  very_good_analysis: ^10.3.0

flutter:
  assets:
    - assets/cocktails/
    - assets/coffee/
